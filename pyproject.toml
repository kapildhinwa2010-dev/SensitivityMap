[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sensitivitymap"
version = "0.1.0"
description = "SensitivityMap - Map output sensitivity of weight rows via perturbation analysis"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
